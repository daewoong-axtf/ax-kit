name: Pages

# 카탈로그와 가이드 게시물(guides/index.json · guides/<slug>/<version>.md)을 GitHub Pages에 올린다.
# 게시물은 매번 git 태그만 보고 처음부터 만든다 (scripts/build-site.ts). AX Desk가 guides/index.json을 읽는다.
# 릴리즈 뒤에는 release.yml이 부른다 — GITHUB_TOKEN이 만든 릴리즈는 다른 워크플로를 깨우지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # build-site는 의존성이 없어 설치하지 않는다
      - run: node scripts/build-site.ts _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
